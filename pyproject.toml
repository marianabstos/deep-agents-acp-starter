[project]
name = "deep-agents-acp-starter"
version = "0.1.0"
description = "Starter project for a Deep Agents coding agent exposed through Agent Client Protocol."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "deepagents-acp",
    "fastapi",
    "langchain-openai",
    "langgraph",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
